name: TEST

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ==========================================
      # CONFIGURE CORE RDP SETTINGS
      # ==========================================
      - name: Configure Core RDP Settings
        run: |
          # Enable Remote Desktop
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force

          # Disable Network Level Authentication
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force

          # Security layer
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          # Remove old firewall rule if it exists
          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          # Allow RDP
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          # Restart RDP service
          Restart-Service -Name TermService -Force

          Write-Host "RDP configurado com sucesso."

      # ==========================================
      # CREATE RDP USER
      # ==========================================
      - name: Create RDP User with Secure Password
        run: |

          Add-Type -AssemblyName System.Security

          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126))
          }

          $rawPassword = @()

          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4

          $password = -join ($rawPassword | Sort-Object { Get-Random })

          $securePass = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          # Remove old user if necessary
          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name "RDP"
          }

          # Create RDP user
          New-LocalUser `
            -Name "RDP" `
            -Password $securePass `
            -AccountNeverExpires

          # Administrator
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP"

          # Remote Desktop Users
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP"

          # Save credentials for this job
          echo "RDP_USERNAME=RDP" >> $env:GITHUB_ENV
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

          Write-Host "Usuário RDP criado."

      # ==========================================
      # INSTALL TAILSCALE
      # ==========================================
      - name: Install Tailscale
        run: |

          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

          $installerPath = "$env:TEMP\tailscale.msi"

          Write-Host "Baixando Tailscale..."

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath

          Write-Host "Instalando Tailscale..."

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item `
            $installerPath `
            -Force

          Write-Host "Tailscale instalado."

      # ==========================================
      # ESTABLISH TAILSCALE CONNECTION
      # ==========================================
      - name: Establish Tailscale Connection
        run: |

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              Write-Error "Tailscale não encontrado."
              exit 1
          }

          Write-Host "Conectando Tailscale..."

          & $tailscale up `
            --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" `
            --hostname="gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Falha ao conectar ao Tailscale."
              exit 1
          }

          Write-Host "Tailscale conectado."

          # Wait for Tailscale IP
          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 20) {

              $tsIP = & $tailscale ip -4 2>$null

              if ($tsIP) {
                  break
              }

              Write-Host "Aguardando IP Tailscale..."

              Start-Sleep -Seconds 5

              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }

          $tsIP = $tsIP.Trim()

          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host "Tailscale IP: $tsIP"

      # ==========================================
      # SHOW TAILSCALE STATUS
      # ==========================================
      - name: Verify Tailscale Connection
        run: |

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          Write-Host "=========================================="
          Write-Host "TAILSCALE STATUS"
          Write-Host "=========================================="

          & $tailscale status

          Write-Host ""
          Write-Host "TAILSCALE IP:"
          & $tailscale ip -4

      # ==========================================
      # VERIFY RDP ACCESSIBILITY
      # ==========================================
      - name: Verify RDP Accessibility
        run: |

          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          Start-Sleep -Seconds 5

          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389

          if (-not $testResult.TcpTestSucceeded) {

              Write-Warning "TCP connection to RDP port 3389 failed."

              # Try restarting RDP
              Restart-Service `
                -Name TermService `
                -Force

              Start-Sleep -Seconds 5

              $testResult = Test-NetConnection `
                -ComputerName $env:TAILSCALE_IP `
                -Port 3389

          }

          if (-not $testResult.TcpTestSucceeded) {

              Write-Error "TCP connection to RDP port 3389 failed."
              exit 1

          }

          Write-Host "TCP connectivity successful!"

      # ==========================================
      # DISPLAY RDP CREDENTIALS
      # ==========================================
      - name: Display RDP Access
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          RDP ACCESS"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USERNAME"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "Port: 3389"
          Write-Host ""
          Write-Host "=========================================="
          Write-Host ""

      # ==========================================
      # MAINTAIN CONNECTION
      # ==========================================
      - name: Maintain Connection
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "RDP ACTIVE"
          Write-Host "=========================================="
          Write-Host ""

          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host ""

          Write-Host "PC Virtual está pronta."
          Write-Host "Sessão limitada pelo GitHub Actions."
          Write-Host ""

          while ($true) {

              Write-Host "[$(Get-Date)] RDP Active - IP: $env:TAILSCALE_IP"

              Start-Sleep -Seconds 300
          }
