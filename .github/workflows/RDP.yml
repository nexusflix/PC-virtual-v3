name: PC Virtual Lite - RDPt

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ==========================================
      # 1. CONFIGURAR RDP
      # ==========================================
      - name: Configurar RDP
        shell: powershell
        run: |
          Write-Host "Configurando Remote Desktop..."

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 0 `
            -Force

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          Set-Service `
            -Name TermService `
            -StartupType Automatic

          Restart-Service `
            -Name TermService `
            -Force

          Write-Host "RDP configurado."

      # ==========================================
      # 2. CRIAR USUÁRIO
      # ==========================================
      - name: Criar usuário RDP
        shell: powershell
        run: |

          $upper = [char[]]"ABCDEFGHJKLMNPQRSTUVWXYZ"
          $lower = [char[]]"abcdefghijkmnopqrstuvwxyz"
          $numbers = [char[]]"23456789"
          $special = [char[]]"!@#$%^&*"

          $passwordChars = @()

          $passwordChars += $upper | Get-Random
          $passwordChars += $lower | Get-Random
          $passwordChars += $numbers | Get-Random
          $passwordChars += $special | Get-Random

          $all = $upper + $lower + $numbers + $special

          while ($passwordChars.Count -lt 20) {
              $passwordChars += $all | Get-Random
          }

          $password = -join ($passwordChars | Sort-Object { Get-Random })

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name "RDP"
          }

          New-LocalUser `
            -Name "RDP" `
            -Password $securePassword `
            -AccountNeverExpires `
            -PasswordNeverExpires

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP"

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP"

          "RDP_USERNAME=RDP" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          Write-Host "Usuário RDP criado."

      # ==========================================
      # 3. INSTALAR TAILSCALE
      # ==========================================
      - name: Instalar Tailscale
        shell: powershell
        run: |

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Write-Host "Baixando Tailscale..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          Write-Host "Instalando Tailscale..."

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait

          Remove-Item `
            $installer `
            -Force

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              Write-Error "Tailscale não foi instalado."
              exit 1
          }

          Write-Host "Tailscale instalado com sucesso."

      # ==========================================
      # 4. CONECTAR TAILSCALE
      # ==========================================
      - name: Conectar Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not $env:TAILSCALE_AUTHKEY) {
              Write-Error "TAILSCALE_AUTHKEY não foi configurada nos Secrets."
              exit 1
          }

          Write-Host "Conectando ao Tailscale..."

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname="gh-rdp-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Falha ao conectar ao Tailscale."
              exit 1
          }

          Write-Host "Tailscale conectado."

      # ==========================================
      # 5. OBTER IP TAILSCALE
      # ==========================================
      - name: Obter IP Tailscale
        shell: powershell
        run: |

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          $ip = $null

          for ($i = 1; $i -le 20; $i++) {

              Write-Host "Obtendo IP... tentativa $i/20"

              $ip = & $tailscale ip -4 2>$null

              if ($ip) {
                  break
              }

              Start-Sleep -Seconds 3
          }

          if (-not $ip) {
              Write-Error "IP Tailscale não encontrado."
              exit 1
          }

          $ip = $ip.Trim()

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

          Write-Host "IP Tailscale:"
          Write-Host $ip

      # ==========================================
      # 6. VERIFICAR TAILSCALE
      # ==========================================
      - name: Verificar Tailscale
        shell: powershell
        run: |

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          Write-Host "Status do Tailscale:"
          & $tailscale status

          Write-Host ""
          Write-Host "IP:"
          & $tailscale ip -4

      # ==========================================
      # 7. OTIMIZAÇÕES
      # ==========================================
      - name: Otimizar Windows
        shell: powershell
        run: |

          Write-Host "Aplicando otimizações..."

          # Menos atraso visual
          Set-ItemProperty `
            -Path "HKCU:\Control Panel\Desktop" `
            -Name "MenuShowDelay" `
            -Value "0"

          # Desativar transparência
          New-Item `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" `
            -Force `
            | Out-Null

          Set-ItemProperty `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" `
            -Name "EnableTransparency" `
            -Value 0 `
            -Force

          Write-Host "Otimizações concluídas."

      # ==========================================
      # 8. TESTAR RDP
      # ==========================================
      - name: Testar RDP
        shell: powershell
        run: |

          Write-Host "Aguardando serviço RDP..."

          Start-Sleep -Seconds 10

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389

          Write-Host ""
          Write-Host "IP: $env:TAILSCALE_IP"
          Write-Host "Porta: 3389"
          Write-Host "Resultado: $($result.TcpTestSucceeded)"

          if ($result.TcpTestSucceeded) {

              Write-Host ""
              Write-Host "RDP FUNCIONANDO!"

          } else {

              Write-Warning "A porta RDP ainda não respondeu."
              Write-Warning "O Tailscale está conectado, mas o RDP pode precisar de mais tempo."
          }

      # ==========================================
      # 9. MOSTRAR CREDENCIAIS
      # ==========================================
      - name: Informações da PC Virtual
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "       PC VIRTUAL LITE ONLINE"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "ENDEREÇO:"
          Write-Host "$env:TAILSCALE_IP"
          Write-Host ""
          Write-Host "USUÁRIO:"
          Write-Host "$env:RDP_USERNAME"
          Write-Host ""
          Write-Host "SENHA:"
          Write-Host "$env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "PORTA:"
          Write-Host "3389"
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "       CONECTE PELO RDP"
          Write-Host "=========================================="
          Write-Host ""

      # ==========================================
      # 10. MANTER ONLINE
      # ==========================================
      - name: Manter PC Virtual Online
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "PC VIRTUAL ONLINE!"
          Write-Host "Sessão limitada a 6 horas."
          Write-Host ""

          while ($true) {

              $time = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

              Write-Host "[$time] RDP ONLINE - $env:TAILSCALE_IP"

              Start-Sleep -Seconds 300
          }
